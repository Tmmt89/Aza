name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    env:
      # Match the release toolchain; older runtimes crash in isolated deinit
      # during XCTest: https://github.com/swiftlang/swift/issues/88036
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Test lexicon pipeline
        run: |
          cd Tools/BuildChechenLexicon
          swift test

      - name: Enable keyboard layouts used by integration tests
        run: |
          swift - <<'SWIFT'
          import Carbon.HIToolbox
          import Foundation
          for id in ["com.apple.keylayout.US", "com.apple.keylayout.Russian"] {
              let filter = [kTISPropertyInputSourceID as String: id] as CFDictionary
              let sources = TISCreateInputSourceList(filter, true).takeRetainedValue() as! [TISInputSource]
              guard let source = sources.first else { fatalError("Missing input source: \(id)") }
              precondition(TISEnableInputSource(source) == noErr, "Cannot enable \(id)")
          }
          SWIFT

      # Signing is skipped: the Debug config uses a local development
      # certificate that only exists on the maintainer's machine.
      # NOTE: locally the project MUST be built with its own signing —
      # ad-hoc signing resets TCC grants and the keychain ACL (§7).
      - name: Build and test the app
        run: |
          xcodebuild -project Aza.xcodeproj -scheme Aza \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            test
